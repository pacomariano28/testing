services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      - auth-service

  auth-service:
    build: ./services/auth-service
    environment:
      - PORT=3000
      - JWT_SECRET=CHANGE_ME_DEV_ONLY
    expose:
      - "3000"
    volumes:
      - ./services/auth-service/src:/app/src
      - ./services/auth-service/tsconfig.json:/app/tsconfig.json:ro